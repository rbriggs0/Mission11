# Matches course video flow: Azure Static Web Apps + GitHub Actions (React / Vite, app in frontend/, out: dist).
#
# REQUIRED — or this job fails with "deployment_token was not provided":
# Azure Portal → your Static Web App → Manage deployment token → copy value.
# GitHub repo → Settings → Secrets and variables → Actions → New repository secret.
# Name must match below. If Azure created the SWA with "Sign in with GitHub", the secret may be named
# AZURE_STATIC_WEB_APPS_API_TOKEN_<suffix>. Either rename your secret to match, or change this file to use Azure's name.
#
# Also add your Static Web App URL (https only, no trailing slash) to backend CORS (Program.cs / appsettings / App Service config).
#
# If you instead deploy the frontend with mission13_mission13-frontend-rb.yml (Azure Web App), you can delete this file to avoid duplicate deploys.

name: Azure Static Web Apps CI/CD (Mission13 frontend)

on:
  push:
    branches:
      - Mission13
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps-mission13-frontend.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Static Web App
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vite (VITE_API_URL baked in at build time)
        working-directory: frontend
        env:
          VITE_API_URL: https://mission13-backend-rb-cnddcsdshkemdbe9.canadacentral-01.azurewebsites.net
        run: npm ci && npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          production_branch: Mission13
