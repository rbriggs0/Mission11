# Frontend on Azure Web App (OIDC — same secrets as backend). No Static Web Apps deployment token required.
# If your instructor uses Static Web Apps instead, add AZURE_STATIC_WEB_APPS_API_TOKEN in GitHub Actions secrets
# and use Azure’s generated workflow, or restore azure-static-web-apps-mission13-frontend.yml with that secret set.
#
# Same pattern as mission13_mission13-backend-rb.yml: build artifact → azure/login → webapps-deploy.
#
# Prereqs in Azure Portal:
# 1. Web App name must match app-name below (subdomain of *.azurewebsites.net).
# 2. Recommended: Windows + .NET or "Static HTML" style hosting so IIS uses public/web.config (SPA routes).
#    If you use Linux only, deep links like /adminbooks may 404 unless you add your own rewrite layer.
# 3. Grant the same GitHub Actions app registration access to this Web App:
#    Web App → Access control (IAM) → Add role assignment → Website Contributor (or Contributor)
#    → select the app registration whose Application (client) ID matches AZUREAPPSERVICE_CLIENTID_* below.
#
# Uses the same OIDC secrets as the backend workflow so one federated login can deploy both apps
# (after IAM is set on the frontend Web App).

name: Build and deploy frontend to Azure Web App - mission13-frontend-rb-fggkfvbyfnatgva7

# No path filter: any push to Mission13 redeploys the static site so it does not stay stale after backend-only commits.
on:
  push:
    branches:
      - Mission13
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_URL: https://mission13-backend-rb-cnddcsdshkemdbe9.canadacentral-01.azurewebsites.net
        run: npm ci && npm run build

      - name: Stage dist for deploy
        run: |
          mkdir -p site-deploy
          cp -r frontend/dist/. site-deploy/
          test -f site-deploy/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-site
          path: site-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-site
          path: site

      - name: Zip wwwroot payload (Kudu zip deploy expects flat archive)
        run: (cd site && zip -r ../release.zip .) && unzip -l release.zip | head -20

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D57AF7754C943DB95D99942FD9FDCD7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DFF58413E0DF459D957A0A4AC1FE905E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_83EC915B83FB44AF9894AC8E190EBECB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mission13-frontend-rb-fggkfvbyfnatgva7'
          resource-group-name: 'appsvc_windows_eastus'
          package: release.zip
